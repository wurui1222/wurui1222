name: your_project_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.9.0
  
  # CUDA Toolkit
  - cudatoolkit=12.1
  - cudnn=8.8
  
  # PyTorch with CUDA 12.1
  - pytorch=2.1.2
  - torchvision=0.16.2
  - pytorch-cuda=12.1
  
  # Scientific computing
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.2.1
  - scikit-learn=1.3.0
  
  # Visualization
  - matplotlib=3.8.3
  - seaborn=0.13.2
  
  # Pip for TensorFlow 
  - pip=23.0+
  - pip:
    - tensorflow==2.9.2
    - keras==2.9.0
    - opencv-python==4.9.0
    - tqdm==4.66.2
    - tensorboard==2.9.1
    - pyyaml==6.0.1